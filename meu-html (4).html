<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Playground — MeuIDE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;flex-wrap:wrap;}
.nav-title{font-weight:700;font-size:14px;color:#58a6ff;}
.nav-link{color:#8b949e;font-size:12px;text-decoration:none;padding:4px 8px;border-radius:4px;}
.nav-link:hover{color:#e6edf3;background:#21262d;}
.nav-right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:#21262d;color:#e6edf3;}
.btn:hover{background:#30363d;}
.btn-blue{background:#1f6feb;color:#fff;}
.btn-blue:hover{background:#388bfd;}
.btn-green{background:#238636;color:#fff;}
.btn-green:hover{background:#2ea043;}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;flex-wrap:wrap;overflow-x:auto;}
.tab-row{display:flex;border-radius:6px;overflow:hidden;border:1px solid #30363d;flex-shrink:0;}
.tab-btn{padding:4px 12px;font-size:11px;border:none;background:transparent;color:#8b949e;cursor:pointer;}
.tab-btn.active{background:#1f6feb;color:#fff;}
input[type="text"],input[type="search"]{background:#0a0e14;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:5px 10px;font-size:12px;}
input[type="text"]:focus,input[type="search"]:focus{outline:none;border-color:#58a6ff;}
.main{flex:1;display:flex;gap:0;overflow:hidden;}
.editor-col{display:flex;flex-direction:column;flex:1;border-right:1px solid #30363d;min-width:0;}
.preview-col{display:flex;flex-direction:column;flex:1;min-width:0;}
.col-header{padding:6px 10px;font-size:11px;color:#8b949e;background:#0a0e14;border-bottom:1px solid #30363d;flex-shrink:0;font-weight:600;}
textarea{flex:1;background:#0a0e14;color:#e6edf3;border:none;resize:none;padding:10px;font-family:'Courier New',monospace;font-size:13px;line-height:1.6;outline:none;tab-size:2;}
iframe{flex:1;border:none;background:#fff;}
.snip-sidebar{width:220px;border-left:1px solid #30363d;display:flex;flex-direction:column;background:#161b22;}
.snip-sidebar.hidden{display:none;}
.snip-header{padding:8px;border-bottom:1px solid #21262d;font-size:12px;font-weight:600;color:#e6edf3;}
.snip-search{padding:6px;border-bottom:1px solid #21262d;}
.snip-search input{width:100%;font-size:11px;}
.snip-list{flex:1;overflow-y:auto;}
.snip-item{padding:8px 10px;cursor:pointer;font-size:11px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.snip-item:hover{background:#1c2128;}
.snip-info{flex:1;min-width:0;}
.snip-title{color:#e6edf3;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.snip-date{font-size:10px;color:#8b949e;margin-top:2px;}
.snip-delete{background:none;border:none;color:#f85149;cursor:pointer;font-size:14px;padding:0;}
.snip-delete:hover{color:#ff7b72;}
.snip-empty{padding:12px;font-size:11px;color:#8b949e;text-align:center;}
#toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:6px;font-size:13px;color:#fff;display:none;z-index:99;}
#toast.show{display:block;}
#toast.ok{background:#238636;}
#toast.err{background:#da3633;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:12px;}
.modal-backdrop.open{display:flex;}
.modal{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;}
.modal h2{margin-bottom:16px;font-size:16px;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;margin-bottom:4px;font-size:12px;color:#8b949e;font-weight:600;}
.modal-field textarea{width:100%;height:200px;padding:10px;border:1px solid #30363d;border-radius:6px;background:#0a0e14;color:#e6edf3;font-family:'Courier New',monospace;font-size:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

/* RESPONSIVO */
@media (max-width:900px){.btn{padding:5px 10px;font-size:11px;}.toolbar{gap:4px;padding:4px 8px;}}
@media (max-width:768px){nav{height:40px;padding:0 8px;}.btn{padding:4px 8px;font-size:10px;}.toolbar{gap:4px;padding:4px 6px;}.main{flex-direction:column;}.editor-col{border-right:none;border-bottom:1px solid #30363d;}.snip-sidebar{width:100%;border-left:none;border-top:1px solid #30363d;max-height:200px;}textarea{padding:6px 10px;font-size:12px;}}
@media (max-width:480px){nav{height:36px;padding:0 6px;gap:4px;}.btn{padding:3px 6px;font-size:9px;}.toolbar{gap:3px;padding:3px 4px;}textarea{font-size:11px;}}
</style>
</head>
<body>
<nav>
<span class="nav-title">🎨 Playground</span>
<a class="nav-link" href="editor.html">Editor</a>
<a class="nav-link" href="chat.html">Chat IA</a>
<div class="nav-right">
<button class="btn" id="toggleSnippetsBtn">📂 Salvos</button>
<button class="btn" onclick="logout()">Sair</button>
</div>
</nav>

<div class="toolbar">
<div class="tab-row">
<button class="tab-btn active" id="tab-html" onclick="setTab('html')">HTML</button>
<button class="tab-btn" id="tab-css" onclick="setTab('css')">CSS</button>
<button class="tab-btn" id="tab-js" onclick="setTab('js')">JS</button>
</div>
<input type="text" id="snip-title" placeholder="Nome do snippet..." style="width:140px;">
<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:#8b949e;">
<input type="checkbox" id="auto-run" checked style="cursor:pointer;"> Auto
</label>
<button class="btn btn-green" onclick="save()">💾 Salvar</button>
<button class="btn" onclick="openImportModal()">↑ Import</button>
<button class="btn" onclick="copyCode()">⧉ Copiar</button>
<button class="btn" onclick="download()">⬇ .html</button>
<button class="btn" onclick="resetCode()">↻ Novo</button>
</div>

<div class="main">
<div class="editor-col">
<div class="col-header" id="editor-label">✏️ HTML</div>
<textarea id="editor" spellcheck="false" oninput="onEdit()" onkeydown="handleTab(event)" placeholder="Digite seu código aqui..."></textarea>
</div>

<div class="preview-col">
<div class="col-header">👁️ Preview ao vivo</div>
<iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
</div>

<div class="snip-sidebar hidden" id="snip-sidebar">
<div class="snip-header">Snippets salvos</div>
<div class="snip-search">
<input type="search" id="snip-search" placeholder="Pesquisar..." oninput="filterSnippets()">
</div>
<div id="snip-list" class="snip-list"></div>
</div>
</div>

<div class="modal-backdrop" id="importModal">
<div class="modal">
<h2>Importar Código</h2>
<div class="modal-field">
<label>Cole seu código aqui:</label>
<textarea id="importCode" placeholder="Cole HTML, CSS ou JS..."></textarea>
</div>
<div class="modal-actions">
<button class="btn" onclick="closeImportModal()">Cancelar</button>
<button class="btn btn-blue" onclick="importCode()">Importar</button>
</div>
</div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sbUrl = localStorage.getItem('sb_url');
const sbKey = localStorage.getItem('sb_key');
let sb = null;
if (sbUrl && sbKey) sb = createClient(sbUrl, sbKey);

let user = null;
let timer = null;
let currentTab = 'html';
let code = { html: `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
  h1 { color: #2563eb; }
  button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
  <h1>🚀 Playground</h1>
  <p>Edite o código e veja ao vivo!</p>
  <button onclick="alert('Funcionou! ✅')">Testar</button>
</body>
</html>`, css: '', js: '' };
let snippets = [];

async function init() {
if (sb) {
const { data } = await sb.auth.getUser();
user = data?.user || null;
}
document.getElementById('editor').value = code.html;
run();
if (sb && user) await loadSnippets();
else loadLocalSnippets();
}

window.setTab = (tab) => {
code[currentTab] = document.getElementById('editor').value;
currentTab = tab;
const labels = { html: '✏️ HTML', css: '🎨 CSS', js: '📜 JavaScript' };
document.getElementById('editor-label').textContent = labels[tab];
document.getElementById('editor').value = code[tab];
['html','css','js'].forEach(t => document.getElementById('tab-'+t).classList.toggle('active', t===tab));
};

function buildDoc() {
const h = code.html.trim().toLowerCase();
if (h.includes('<!doctype') || h.includes('<html')) return code.html;
return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${code.css}</style></head><body>${code.html}<script>${code.js}<\/script></body></html>`;
}

window.run = () => {
code[currentTab] = document.getElementById('editor').value;
const doc = buildDoc();
const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
const url = URL.createObjectURL(blob);
const frame = document.getElementById('preview');
if (frame._prev) URL.revokeObjectURL(frame._prev);
frame._prev = url;
frame.src = url;
};

window.onEdit = () => {
if (!document.getElementById('auto-run').checked) return;
clearTimeout(timer);
timer = setTimeout(run, 600);
};

window.handleTab = (e) => {
if (e.key !== 'Tab') return;
e.preventDefault();
const t = e.target, s = t.selectionStart;
t.value = t.value.substring(0,s) + '  ' + t.value.substring(t.selectionEnd);
t.selectionStart = t.selectionEnd = s + 2;
onEdit();
};

window.download = () => {
code[currentTab] = document.getElementById('editor').value;
const title = document.getElementById('snip-title').value || 'playground';
const a = document.createElement('a');
a.href = URL.createObjectURL(new Blob([buildDoc()], { type: 'text/html' }));
a.download = title + '.html'; a.click();
toast('✅ Arquivo baixado!');
};

window.copyCode = async () => {
code[currentTab] = document.getElementById('editor').value;
try {
await navigator.clipboard.writeText(buildDoc());
toast('✅ Copiado!');
} catch {
toast('❌ Erro ao copiar', 'err');
}
};

window.resetCode = () => {
if (!confirm('Descartar código atual?')) return;
code = { html: '', css: '', js: '' };
document.getElementById('snip-title').value = '';
currentTab = 'html';
setTab('html');
run();
toast('✅ Novo código!');
};

window.openImportModal = () => {
document.getElementById('importModal').classList.add('open');
document.getElementById('importCode').value = '';
};

window.closeImportModal = () => {
document.getElementById('importModal').classList.remove('open');
};

window.importCode = () => {
const content = document.getElementById('importCode').value.trim();
if (!content) { toast('❌ Cole algum código!', 'err'); return; }
const h = content.toLowerCase();
if (h.includes('<!doctype') || h.includes('<html')) {
code.html = content; code.css = ''; code.js = ''; currentTab = 'html';
} else if (h.includes('<style') || content.includes('body {')) {
code.css = content; currentTab = 'css';
} else {
code.js = content; currentTab = 'js';
}
setTab(currentTab);
run();
closeImportModal();
toast('✅ Código importado!');
};

window.save = async () => {
code[currentTab] = document.getElementById('editor').value;
const title = document.getElementById('snip-title').value.trim() || 'Sem título';

if (sb && user) {
const { error } = await sb.from('snippets').insert({
user_id: user.id, title, html: code.html, css: code.css, js: code.js
});
if (error) { toast('❌ Erro: ' + error.message, 'err'); return; }
toast('✅ Salvo no Supabase!');
await loadSnippets();
} else {
const local = JSON.parse(localStorage.getItem('snippets') || '[]');
local.push({ id: Date.now(), title, html: code.html, css: code.css, js: code.js, date: new Date().toISOString() });
localStorage.setItem('snippets', JSON.stringify(local));
toast('✅ Salvo localmente!');
loadLocalSnippets();
}
};

async function loadSnippets() {
if (!sb || !user) return;
const { data } = await sb.from('snippets').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
snippets = data || [];
renderSnippets(snippets);
}

function loadLocalSnippets() {
const local = JSON.parse(localStorage.getItem('snippets') || '[]');
snippets = local;
renderSnippets(snippets);
}

function renderSnippets(list) {
document.getElementById('snip-list').innerHTML = list.length
? list.map(s => `
<div class="snip-item" onclick="loadSnippet(${JSON.stringify(s).replace(/"/g,'&quot;')})">
<div class="snip-info">
<div class="snip-title">${escapeHtml(s.title)}</div>
<div class="snip-date">${s.date ? new Date(s.date).toLocaleDateString('pt-BR') : new Date(s.created_at).toLocaleDateString('pt-BR')}</div>
</div>
<button class="snip-delete" onclick="event.stopPropagation();deleteSnippet('${s.id}')">✕</button>
</div>`)
.join('')
: '<div class="snip-empty">Nenhum snippet salvo</div>';
}

window.loadSnippet = (s) => {
code.html = s.html || ''; code.css = s.css || ''; code.js = s.js || '';
document.getElementById('snip-title').value = s.title || '';
currentTab = 'html';
setTab('html');
run();
toast('✅ Snippet carregado!');
};

window.deleteSnippet = async (id) => {
if (!confirm('Deletar snippet?')) return;
if (sb && user) {
await sb.from('snippets').delete().eq('id', id);
await loadSnippets();
} else {
const local = JSON.parse(localStorage.getItem('snippets') || '[]').filter(s => String(s.id) !== String(id));
localStorage.setItem('snippets', JSON.stringify(local));
loadLocalSnippets();
}
toast('✅ Deletado!');
};

window.filterSnippets = () => {
const term = document.getElementById('snip-search').value.toLowerCase();
const filtered = snippets.filter(s => s.title.toLowerCase().includes(term));
renderSnippets(filtered);
};

function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type='ok') {
const t = document.getElementById('toast');
t.textContent = msg; t.className = 'show ' + type;
setTimeout(()=>t.className='',3000);
}

window.logout = async () => { if (sb) await sb.auth.signOut(); window.location.href = 'index.html'; };

document.getElementById('toggleSnippetsBtn').addEventListener('click', () => {
const s = document.getElementById('snip-sidebar');
s.classList.toggle('hidden');
if (!s.classList.contains('hidden')) loadLocalSnippets();
});

init();
</script>
</body>
</html>
